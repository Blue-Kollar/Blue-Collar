name: Secret Scan

# Block committed secrets from reaching the repo. Uses Gitleaks to scan every
# push and PR with the repository's local config (.gitleaks.toml).
# CI fails (blocking gate) when a secret pattern is detected.
# Closes #798
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Detect secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (local config)
        run: |
          # PRs: scan only the commits introduced by the PR.
          # Pushes / manual runs: scan all refs in history.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="origin/${{ github.base_ref }}..HEAD"
          else
            LOG_OPTS="--all"
          fi
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --exit-code 1

      - name: Upload Gitleaks results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif

  trufflehog:
    name: Detect secrets (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@v3.88.27
        with:
          # On PRs scan only the delta; on push scan full history
          # The action includes --fail by default; do not pass it in extra_args
          extra_args: --only-verified
