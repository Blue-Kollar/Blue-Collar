name: DB Migrations

# Verify Prisma migrations apply cleanly forward against a fresh database
# in CI. Detects drift, validates seed scripts, and catches missing
# migration_lock.toml.
# Closes #817
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bluecollar
          POSTGRES_PASSWORD: bluecollar
          POSTGRES_DB: bluecollar
        options: >-
          --health-cmd "pg_isready -U bluecollar -d bluecollar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for destructive migrations (#835)
        run: bash .github/scripts/check-destructive-migrations.sh
        env:
          BASE_BRANCH: origin/main

      # pnpm comes from the repo's `packageManager` field; the lockfile is v9 and
      # cannot be read by older pnpm majors.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://bluecollar:bluecollar@localhost:5432/bluecollar

      - name: Apply all migrations
        run: npx prisma migrate deploy
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://bluecollar:bluecollar@localhost:5432/bluecollar

      - name: Validate schema matches database
        run: npx prisma validate
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://bluecollar:bluecollar@localhost:5432/bluecollar

      # `migrate diff --from-migrations` replays the migration history into a
      # throwaway database, so it needs one that already exists.
      - name: Create shadow database
        run: |
          PGPASSWORD=bluecollar psql -h localhost -U bluecollar -d postgres \
            -c 'CREATE DATABASE "bluecollar_shadow";'

      - name: Detect drift (diff migrations vs schema)
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://bluecollar:bluecollar@localhost:5432/bluecollar
          SHADOW_DATABASE_URL: postgresql://bluecollar:bluecollar@localhost:5432/bluecollar_shadow

      - name: Run seed script
        run: npx tsx src/database/seed.ts
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://bluecollar:bluecollar@localhost:5432/bluecollar
          SEED_ADMIN_PASSWORD: TestAdminPass1
          SEED_CURATOR_PASSWORD: TestCuratorPass1
          NODE_ENV: test
