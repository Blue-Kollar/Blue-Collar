[workspace]
members = [
    "contracts/types",
    "contracts/registry",
    "contracts/market",
    "contracts/dispute",
    "contracts/fee_distribution",
    "contracts/insurance_pool",
    "contracts/fuzz",
    "contracts/integration",
    # Issue #1017 — reputation contract (security-audited)
    "contracts/reputation",
    # Issue #1018 — job-registry contract (modular: storage/logic/lib)
    "contracts/job_registry",
    # Issue #1019 — payment contract (comprehensive test coverage)
    "contracts/payment",
    # Issue #1020 — escrow contract (modular: storage/logic/lib)
    "contracts/escrow",
    # Shared utilities and test fixtures (issue #1446)
    "../../contracts/shared",
]
resolver = "2"

# ── Shared dependency versions ────────────────────────────────────────────────
# Pin soroban-sdk once here so every crate uses the same version automatically.
# To upgrade: change the version below and run `cargo update` — no per-crate
# edits needed.
[workspace.dependencies]
soroban-sdk = { version = "26.1.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1

# Lint policy for all contract crates (issue #1254).
# Each crate opts in via `[lints] workspace = true` in its own Cargo.toml.
[workspace.lints.rust]
# Surface unused private functions during `cargo build`/`cargo clippy` so they
# can be removed or documented (issue #1680).
dead_code = "allow"
# Allow deprecated Soroban SDK APIs (Events::publish, Env::register_contract, etc.)
# so -D warnings doesn't block on these known migrations (issue #1678).
deprecated = "allow"

[workspace.lints.clippy]
# Enable the pedantic group as a warning (not deny) so issues surface without
# blocking compilation. Crate authors should fix or explicitly allow each one.
pedantic = { level = "warn", priority = -1 }
# ----- Blanket exceptions for Soroban contract patterns -----
# Soroban entry-point functions receive `Env` by value (SDK requirement).
needless_pass_by_value = "allow"
# Contract query functions are called by the host; `#[must_use]` is irrelevant.
must_use_candidate = "allow"
# SDK-generated discriminant casts are safe and intentional.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Documenting every `Err` variant is aspirational but not enforced in MVP.
missing_errors_doc = "allow"
# Module-level doc missing on private helper modules is acceptable.
module_name_repetitions = "allow"
# Pedantic style lints below are documented as non-blocking for contracts:
# - doc_markdown: generated/ABI-style identifiers are easier to grep unquoted.
# - uninlined_format_args / bool_assert_comparison / len_zero: test-only style.
# - missing_panics_doc / too_many_arguments: Soroban entry points are wide by design.
# - needless_lifetimes / needless_borrow / cast_lossless: idiom churn with no runtime effect.
# - should_panic_without_expect / used_underscore_binding: legacy tests.
# - wildcard_imports / module_inception: prelude-style test imports and `mod x` modules.
doc_markdown = "allow"
uninlined_format_args = "allow"
bool_assert_comparison = "allow"
len_zero = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
needless_lifetimes = "allow"
needless_borrow = "allow"
cast_lossless = "allow"
should_panic_without_expect = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"
module_inception = "allow"
# Registry-specific clippy allows
needless_borrows_for_generic_args = "allow"
unnecessary_cast = "allow"
