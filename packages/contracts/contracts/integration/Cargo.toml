[package]
name = "bluecollar-integration"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "End-to-end integration tests for BlueCollar Soroban contracts against the in-process testnet"

[lib]
name = "bluecollar_integration"
# No cdylib – this crate is test-only.

[dev-dependencies]
# Test-only crate (issue #1448): the lib is an empty harness, so every
# contract below is only linked by the `tests/` suite — none of them
# participate in a normal build of this crate.
soroban-sdk = { workspace = true, features = ["testutils"] }
bluecollar-types    = { path = "../types" }
bluecollar-registry = { path = "../registry" }
bluecollar-market   = { path = "../market" }
bluecollar-dispute  = { path = "../dispute" }
bluecollar-escrow   = { path = "../escrow" }
bluecollar-reputation = { path = "../reputation" }
bluecollar-job-registry = { path = "../job_registry" }
bluecollar_insurance_pool = { path = "../insurance_pool" }

[lints]
workspace = true
