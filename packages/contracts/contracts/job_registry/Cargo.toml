[package]
name = "bluecollar-job-registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
bluecollar-types = { path = "../types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
bluecollar-types = { path = "../types", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[lints]
workspace = true