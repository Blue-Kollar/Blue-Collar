[package]
name = "bluecollar-access-control"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }
bluecollar-types = { path = "../types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
