[package]
name = "token"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { version = "21.0.0", default-features = false }
bluecollar-shared = { path = "../shared" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
bluecollar-shared = { path = "../shared", features = ["testutils"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]
