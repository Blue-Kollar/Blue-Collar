[package]
name = "bluecollar-shared"
version = "0.1.0"
edition = "2021"
publish = false
# The workspace lives under packages/contracts; declare it explicitly so the
# manifest resolves `workspace = true` inheritance (issue #1446).
workspace = "../../packages/contracts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
bluecollar-types = { path = "../../packages/contracts/contracts/types" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
bluecollar-types = { path = "../../packages/contracts/contracts/types", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "bluecollar-types/testutils"]

[lints]
workspace = true
